[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "uidaho-csdms-diffusion-model"
version = "0.0"
dependencies = [
    "matplotlib",
    "numpy",
]

[project.optional-dependencies]
testing = [
  "pytest",
  "nbmake",
]

[tool.setuptools]
py-modules = ["Diffusion_Model"]
